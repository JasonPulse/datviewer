name: Release

# Semantic-release drives versioning off Conventional Commits on `main`:
#   feat: -> minor, fix: -> patch, feat!/BREAKING CHANGE -> major.
# When a release is cut it tags vX.Y.Z, updates CHANGELOG.md and creates the GitHub Release, then
# the build jobs export the Windows + macOS apps and attach them.
#
# DatViewer is self-contained — the Vellichor decoders + render sources are vendored under Vendor/ —
# so CI is a single normal checkout with no cross-repo access and no game data ever fetched.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.1"
  DOTNET_VERSION: "8.0.x"

jobs:
  # ---------------------------------------------------------------------------------------------
  release:
    name: Semantic release (version + GitHub release)
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------------------------
  build:
    name: Export ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: ubuntu-latest        # Godot cross-exports Windows from Linux
            preset: "Windows Desktop"
            out: build/windows/DatViewer.exe
            asset: DatViewer-windows-x86_64
          - name: macos
            runner: macos-latest
            preset: "macOS"
            out: build/macos/DatViewer.app
            asset: DatViewer-macos-universal
    steps:
      - name: Checkout DatViewer (release tag)
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup Godot ${{ env.GODOT_VERSION }} (.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Build C# + import
        run: |
          dotnet build DatViewer.csproj -c ExportRelease
          # Import twice: on a fresh checkout the first pass doesn't resolve the C# script link, so
          # the scene (Main.scn) isn't generated and the export packs an empty pck (grey-screen app).
          godot --headless --import . || true
          godot --headless --import . || true
      - name: Export
        run: |
          mkdir -p "$(dirname "${{ matrix.out }}")"
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.out }}"
      - name: Bundle loose data (List/ + data/ ride next to the app, not in the .pck)
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            cp -R List data "${{ matrix.out }}/Contents/Resources/"
          else
            cp -R List data "$(dirname "${{ matrix.out }}")/"
          fi
      - name: Package
        run: |
          cd "$(dirname "${{ matrix.out }}")"
          zip -qry "${{ matrix.asset }}-v${{ needs.release.outputs.version }}.zip" .
          echo "ASSET=$PWD/${{ matrix.asset }}-v${{ needs.release.outputs.version }}.zip" >> "$GITHUB_ENV"
      - name: Attach to release
        run: gh release upload "v${{ needs.release.outputs.version }}" "$ASSET" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
